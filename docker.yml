services:
  # =======================
  # API GATEWAY SERVICE
  # =======================
  gateway:
    build: ./gateway # Build using Dockerfile in this folder
    container_name: gateway
    restart: always
    ports:
      - "6060:6060" # Host:Container
    env_file:
      - ./gateway/.env # Load environment variables
    depends_on:
      - user
      - invoice
    networks:
      - microservice-network

  # =======================
  # USER SERVICE (MySQL)
  # =======================
  user:
    build: ./user
    container_name: user
    restart: always
    ports:
      - "6061:6061"
    env_file:
      - ./user/.env
    depends_on:
      - mysql
    networks:
      - microservice-network

  # =======================
  # INVOICE SERVICE (MongoDB)
  # =======================
  invoice:
    build: ./invoice
    container_name: invoice
    restart: always
    ports:
      - "6062:6062"
    env_file:
      - ./invoice/.env
    depends_on:
      - mongo
    networks:
      - microservice-network

  # =======================
  # AUDIT SERVICE (MongoDB + RabbitMQ)
  # =======================
  audit:
    build: ./audit
    container_name: audit
    restart: always
    ports:
      - "6063:6063"
    env_file:
      - ./audit/.env
    depends_on:
      - mongo
      - rabbitmq
    networks:
      - microservice-network

  # =======================
  # NOTIFICATION SERVICE (RabbitMQ)
  # =======================
  notification:
    build: ./notification
    container_name: notification
    restart: always
    ports:
      - "6064:6064"
    env_file:
      - ./notification/.env
    depends_on:
      - rabbitmq
    networks:
      - microservice-network

  # =======================
  # MYSQL DATABASE
  # =======================
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: user_db
      MYSQL_USER: myuser
      MYSQL_PASSWORD: 1234
    ports:
      - "3307:3306" # Optional: expose for local access
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - microservice-network

  # =======================
  # MONGODB DATABASE
  # =======================
  mongo:
    image: mongo:4.4
    container_name: mongo_invoice_db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 1234
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - microservice-network

  # =======================
  # RABBITMQ (Message Broker)
  # =======================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_broker
    restart: always
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # RabbitMQ UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - microservice-network

# =======================
# VOLUMES (Persist DB data)
# =======================
volumes:
  mysql-data:
  mongo-data:
  rabbitmq_data:

# =======================
# NETWORK (Service discovery)
# =======================
networks:
  microservice-network:
    driver: bridge
